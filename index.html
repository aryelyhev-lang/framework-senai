<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
    <title>hellobulma</title>
</head>

<body class="custom-bg">
    <header>
        <div class="has-text-centered">
            <figure class="logo logo-senai">
                <img src="img/SENAI_São_Paulo_logo.png" alt="">
            </figure>
        </div>
    </header>
    <main>
        <!-- Para ultilizar a custumização pronta da bibliteca é necessário criar uma classe
        na tag que você deseja custumizar.   -->
        <div class="has-text-centered is-size-2 mt-5">
            <p class="has-text-white is-inline">Aprende</p>
            <p class="fazendo">fazendo</p>
        </div>
        <div class="has-text-centered is-size-2 mt-5">
            <p class="has-text-white is-inline">Faz</p>
            <p class="sabendo">sabendo</p>
        </div>
    </main>
    <footer></footer>
</body>

</html>
